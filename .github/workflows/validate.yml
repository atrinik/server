name: Server validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Install pinned Syft
        run: |
          install -d "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location \
            https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz \
            --output "${RUNNER_TEMP}/syft.tar.gz"
          printf '%s  %s\n' bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788 "${RUNNER_TEMP}/syft.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: Install pinned quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/google/go-licenses@v1.6.0
      - name: Validate repository and release dry-run
        run: tools/validate.sh

  windows:
    name: Windows build and tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - run: go test ./...
      - run: go build -trimpath ./cmd/atrinik-server

  aggregate:
    name: Server validation
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every supported platform
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "${LINUX_RESULT}" = success -a "${WINDOWS_RESULT}" = success
