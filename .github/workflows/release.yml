name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: server-semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Install pinned Syft
        run: |
          install -d "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location \
            https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz \
            --output "${RUNNER_TEMP}/syft.tar.gz"
          printf '%s  %s\n' bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788 "${RUNNER_TEMP}/syft.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}/bin" syft
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"
      - name: Install pinned quality tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/google/go-licenses@v1.6.0
      - name: Revalidate the exact release revision
        run: tools/validate.sh
      - name: Analyze commits, build immutable assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          semantic-release
